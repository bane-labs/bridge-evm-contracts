[profile.default]
src = 'contracts'
build_info = true
extra_output = ["storageLayout"]
fs_permissions = [{ access = "read", path = "./"}]
out = 'out'
libs = ['node_modules', 'lib']
test = 'test'
cache_path  = 'cache_forge'
ffi = true

solc_version = "0.8.25"
evm_version = "shanghai"

optimizer = true
## optimizer-runs = 1

[fmt]
multiline_func_header = "all"
single_line_statement_blocks = "single"
