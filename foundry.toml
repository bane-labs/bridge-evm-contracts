[profile.default]
src = 'contracts'
build_info = true
extra_output = ["storageLayout"]
fs_permissions = [
  { access = "read", path = "./" },
  { access = "read-write", path = "./deployments/foundry" }
]
out = 'out'
libs = ['node_modules', 'lib']
test = 'test'
cache_path  = 'cache_forge'
ffi = true

solc_version = "0.8.25"
evm_version = "shanghai"
# Avoid Foundry OpenChain/proxy panics in this environment by disabling network-backed lookups.
offline = true
# Always run full compilation so OpenZeppelin upgrades validation sees complete build-info artifacts.
force = true

optimizer = true
## optimizer-runs = 1

[fmt]
multiline_func_header = "all"
single_line_statement_blocks = "single"
